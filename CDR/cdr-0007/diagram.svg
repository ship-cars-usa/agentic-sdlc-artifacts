<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172 296" role="img" aria-label="The expedited flag flows from platform-backend Postgres, published on the carrierlb.events firehose, consumed by syncer which indexes it into the loads Elasticsearch index, read by cube and exposed on its order-search REST response. The firehose also fans out to 12 other subscribers that tolerate the new field unchanged.">
