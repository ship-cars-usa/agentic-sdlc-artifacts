<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172 296" role="img" aria-label="The expedited flag flows from platform-backend Postgres, published on the carrierlb.events firehose, consumed by syncer which indexes it into the loads Elasticsearch index, read by cube and exposed on its order-search REST response. The firehose also fans out to 12 other subscribers that tolerate the new field unchanged.">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
    <marker id="a2f" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line-2)"/></marker>
  </defs>
  <rect x="10" y="96" width="150" height="76" rx="11" class="n-box touched"/>
  <text x="24" y="122" class="n-title">platform-backend</text><text x="24" y="140" class="n-sub">Django · DRF</text>
  <text x="24" y="156" class="store">PG: platform / epod</text><text x="24" y="88" class="badge add">+ column · + event field</text>
  <path d="M160 134 H248" class="flow hot" marker-end="url(#a2)"/><text x="204" y="124" class="flow-lbl hot" text-anchor="middle">publish</text>
  <rect x="256" y="96" width="168" height="76" rx="11" class="n-box touched"/>
  <text x="270" y="122" class="n-title">carrierlb.events</text><text x="270" y="140" class="n-sub">firehose topic</text>
  <text x="270" y="156" class="store">snake_case · +field</text><text x="256" y="88" class="badge add">+ expedited</text>
  <path d="M424 134 H512" class="flow hot" marker-end="url(#a2)"/><text x="468" y="124" class="flow-lbl hot" text-anchor="middle">consume</text>
  <rect x="520" y="96" width="150" height="76" rx="11" class="n-box touched"/>
  <text x="534" y="122" class="n-title">syncer</text><text x="534" y="140" class="n-sub">Quarkus indexer</text>
  <text x="534" y="156" class="store">DTO reflection map</text><text x="520" y="88" class="badge chg">DTO + resync</text>
  <path d="M670 134 H758" class="flow hot" marker-end="url(#a2)"/><text x="714" y="124" class="flow-lbl hot" text-anchor="middle">index</text>
  <rect x="766" y="96" width="150" height="76" rx="11" class="n-box touched"/>
  <text x="780" y="122" class="n-title">ES · loads</text><text x="780" y="140" class="n-sub">index (no alias)</text>
  <text x="780" y="156" class="store">+ mapping field</text><text x="766" y="88" class="badge chg">rebuild</text>
  <path d="M916 134 H1004" class="flow hot" marker-end="url(#a2)"/><text x="960" y="124" class="flow-lbl hot" text-anchor="middle">read</text>
  <rect x="1012" y="96" width="150" height="76" rx="11" class="n-box touched"/>
  <text x="1026" y="122" class="n-title">cube</text><text x="1026" y="140" class="n-sub">CQRS read + REST</text>
  <text x="1026" y="156" class="store">+ resp DTO field</text><text x="1012" y="88" class="badge add">API + DTO</text>
  <path d="M340 172 C340 216, 210 210, 178 230" class="flow faint" marker-end="url(#a2f)"/>
  <path d="M340 172 C340 222, 430 212, 430 230" class="flow faint" marker-end="url(#a2f)"/>
  <path d="M340 172 C340 228, 640 214, 700 230" class="flow faint" marker-end="url(#a2f)"/>
  <text x="176" y="250" class="n-sub" text-anchor="middle">notification</text>
  <text x="430" y="250" class="n-sub" text-anchor="middle">posting</text>
  <text x="770" y="250" class="n-sub" text-anchor="middle">+ 12 more subscribers (tolerate unchanged)</text>
</svg>
