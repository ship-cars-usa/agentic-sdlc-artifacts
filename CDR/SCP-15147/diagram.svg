<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500">
  <defs>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#8a929b"/></marker>
    <marker id="arrHot" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="500" fill="#ffffff"/>

  <text x="16" y="24" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">SCP-15147 — the join, and the boundary that shapes every option. Every hop keys on the same C-… user-management id.</text>

  <rect x="16" y="44" width="188" height="76" rx="8" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="110" y="70" fill="#16191d" font-size="14" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">AAAG parent company</text>
  <text x="110" y="90" fill="#5c646d" font-size="12" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">C-JCJSA2NLCNBDVIMMMM6Z43I52I</text>
  <text x="110" y="109" fill="#7a828b" font-size="11" font-style="italic" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">already hardcoded in utils/aaag/</text>

  <rect x="248" y="44" width="188" height="76" rx="8" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="342" y="70" fill="#16191d" font-size="14" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">~15+ child auctions</text>
  <text x="342" y="90" fill="#5c646d" font-size="12" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">Albany · Atlanta · Baton Rouge …</text>
  <text x="342" y="109" fill="#b45309" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">each has its OWN network</text>

  <path d="M204 82 H244" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrHot)"/>
  <text x="224" y="74" fill="#b45309" font-size="11" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">parent_id</text>

  <rect x="16" y="186" width="420" height="122" rx="8" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="34" y="210" fill="#374151" font-size="12" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">platform-backend · Postgres "platform"</text>
  <rect x="34" y="222" width="384" height="70" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.2"/>
  <text x="50" y="243" fill="#16191d" font-size="13" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">ComplianceNetworkLink</text>
  <text x="50" y="262" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">shipper · carrier · status · document_request_status</text>
  <text x="50" y="281" fill="#7a828b" font-size="11" font-style="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">answers: who is in this auction's network</text>
  <path d="M342 120 V182" fill="none" stroke="#8a929b" stroke-width="1.6" marker-end="url(#arrGray)"/>

  <rect x="524" y="186" width="400" height="248" rx="8" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="542" y="210" fill="#374151" font-size="12" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">company-documents · Postgres "company-documents"</text>

  <rect x="542" y="222" width="364" height="90" rx="6" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.2"/>
  <text x="558" y="243" fill="#16191d" font-size="13" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">CarrierDocument</text>
  <text x="558" y="262" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">type · document_status · visibility · filename</text>
  <text x="558" y="281" fill="#b45309" font-size="12" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">versions_create_time_list → upload date</text>
  <text x="558" y="300" fill="#b91c1c" font-size="11" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">NULL for old rows until the backfill runs</text>

  <rect x="542" y="326" width="364" height="90" rx="6" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.2"/>
  <text x="558" y="347" fill="#16191d" font-size="13" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">ShipperCarrierDocument (per-shipper wrapper)</text>
  <text x="558" y="366" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">expiration_date → the expiry the auction typed in</text>
  <text x="558" y="385" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">is_shipper_tracked · internal_notes → did they review?</text>
  <text x="558" y="404" fill="#b45309" font-size="11" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">updated_at ADDED — "last reviewed" is blind today</text>

  <path d="M436 252 H520" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrHot)"/>
  <text x="478" y="243" fill="#b45309" font-size="11" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">carrier_id</text>
  <text x="478" y="270" fill="#b45309" font-size="11" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">= C-… UMID</text>

  <path d="M480 156 V462" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="480" y="150" fill="#b91c1c" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">separate Postgres instances</text>
  <text x="480" y="480" fill="#b91c1c" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">no cross-DB join — one side must call the other</text>

  <rect x="16" y="344" width="420" height="90" rx="8" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="34" y="368" fill="#374151" font-size="12" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">GCS bucket · blob metadata</text>
  <text x="34" y="390" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">Source of truth for upload times and document metadata.</text>
  <text x="34" y="411" fill="#7a828b" font-size="11" font-style="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">Avoided by design: one bucket listing per carrier per auction.</text>
</svg>
