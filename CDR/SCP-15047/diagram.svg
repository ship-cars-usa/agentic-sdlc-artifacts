<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="The bulk worker fetches a Load (instance A) and runs Revision.accept, which mutates a different instance (B) and correctly saves to Postgres; but the worker serializes its stale instance A into both the HTTP response and event.new_value, and ctms-frontend merges that stale response into Redux after the socket refetch already corrected the grid.">
  <defs>
    <marker id="s47" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
    <marker id="s47r" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--rem)"/></marker>
  </defs>
  <rect x="10" y="20" width="180" height="70" rx="11" class="n-box touched"/>
  <text x="24" y="46" class="n-title">bulk worker</text><text x="24" y="64" class="n-sub">process_bulk_action</text>
  <text x="24" y="80" class="store">instance A · stale in memory</text>
  <text x="10" y="12" class="badge chg">refresh_from_db()</text>
  <path d="M190 55 H286" class="flow hot" marker-end="url(#s47)"/><text x="238" y="47" class="flow-lbl hot" text-anchor="middle">action_func</text>
  <rect x="288" y="20" width="180" height="70" rx="11" class="n-box"/>
  <text x="302" y="46" class="n-title">Revision.accept</text><text x="302" y="64" class="n-sub">mutates instance B</text>
  <text x="302" y="80" class="n-sub">(revision.load)</text>
  <path d="M468 55 H564" class="flow hot" marker-end="url(#s47)"/><text x="516" y="47" class="flow-lbl hot" text-anchor="middle">save</text>
  <rect x="566" y="20" width="184" height="70" rx="11" class="n-box"/>
  <text x="580" y="46" class="n-title">PG · loads</text><text x="580" y="64" class="store">correct (row updated)</text>
  <path d="M100 90 V150" class="flow brkline" marker-end="url(#s47r)"/><text x="110" y="128" class="flow-lbl rem">serializes stale instance A</text>
  <rect x="10" y="150" width="270" height="72" rx="11" class="n-box touched"/>
  <text x="24" y="176" class="n-title">HTTP response + event.new_value</text><text x="24" y="194" class="n-sub">stale snapshot (pre-accept)</text>
  <text x="24" y="210" class="store">pre-mutation active_revision_id</text>
  <path d="M280 186 H364" class="flow hot" marker-end="url(#s47)"/><text x="322" y="178" class="flow-lbl hot" text-anchor="middle">merge</text>
  <rect x="366" y="150" width="230" height="72" rx="11" class="n-box touched"/>
  <text x="380" y="176" class="n-title">ctms-frontend · Redux</text><text x="380" y="194" class="n-sub">merged after socket refetch</text>
  <text x="380" y="210" class="store">"Revision" caption sticks</text>
  <text x="610" y="190" class="n-sub">datastores fine —</text><text x="610" y="205" class="n-sub">stale only in browser</text>
</svg>
