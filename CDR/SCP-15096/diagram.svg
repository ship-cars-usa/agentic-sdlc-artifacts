<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--accent)"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--rem)"/></marker>
    <style>
      .n-box{fill:var(--surface-2,#1b252c);stroke:var(--line-2,#334049)}
      .n-box.touched{fill:var(--accent-soft,#122f39);stroke:var(--accent,#48bad9);stroke-width:1.6}
      .n-title{fill:var(--ink,#e7edf1);font-weight:600;font-size:13px}
      .n-sub{fill:var(--muted,#93a4b0);font-family:ui-monospace,monospace;font-size:10px}
      .store{fill:var(--ink,#e7edf1);font-family:ui-monospace,monospace;font-size:10px}
      .flow{stroke:var(--muted,#93a4b0);stroke-width:1.5;fill:none}
      .flow.hot{stroke:var(--accent,#48bad9);stroke-width:2;fill:none}
      .flow.brkline{stroke:var(--rem,#ee6d5f);stroke-width:2;stroke-dasharray:4 4;fill:none}
      .flow-lbl{font-size:10.5px;fill:var(--muted,#93a4b0)}
      .flow-lbl.hot{fill:var(--add,#4fc389)}
      .flow-lbl.rem{fill:var(--rem,#ee6d5f)}
      .badge{font-size:10px;font-weight:700}
      .badge.add{fill:var(--add,#4fc389)}
      .badge.chg{fill:var(--chg,#e0a341)}
    </style>
  </defs>

  <!-- clients -->
  <rect class="n-box touched" x="24" y="36" width="210" height="56" rx="9"/>
  <text class="n-title" x="129" y="60" text-anchor="middle">CTMS web · StatusUpdateDialog</text>
  <text class="n-sub" x="129" y="78" text-anchor="middle">+ vehicles[].vin</text>

  <rect class="n-box touched" x="24" y="150" width="210" height="56" rx="9"/>
  <text class="n-title" x="129" y="174" text-anchor="middle">epod-ios · ManualStatusUpdate</text>
  <text class="n-sub" x="129" y="192" text-anchor="middle">DTO has no vin today</text>

  <rect class="n-box touched" x="24" y="264" width="210" height="56" rx="9"/>
  <text class="n-title" x="129" y="288" text-anchor="middle">epod-android · UpdateOrderManually</text>
  <text class="n-sub" x="129" y="306" text-anchor="middle">no vin · offline drop on 400</text>

  <!-- backend endpoint -->
  <rect class="n-box touched" x="392" y="120" width="200" height="130" rx="11"/>
  <text class="n-title" x="492" y="148" text-anchor="middle">platform-backend</text>
  <text class="n-sub" x="492" y="170" text-anchor="middle">POST manual_pickup/</text>
  <text class="n-sub" x="492" y="185" text-anchor="middle">POST manual_deliver/</text>
  <text class="flow-lbl" x="492" y="208" text-anchor="middle">gate: is_enabled(flag)</text>
  <text class="flow-lbl" x="492" y="223" text-anchor="middle">&amp;&amp; !forbid_vehicle_update</text>
  <text class="badge chg" x="492" y="242" text-anchor="middle">validate VIN ≥6 before mutate</text>

  <!-- store -->
  <rect class="n-box" x="392" y="300" width="200" height="52" rx="9"/>
  <text class="store" x="492" y="322" text-anchor="middle">epod_vehicle.vin</text>
  <text class="store" x="492" y="338" text-anchor="middle">Vehicle.set_vin()</text>

  <!-- outcomes -->
  <rect class="n-box" x="690" y="70" width="186" height="60" rx="9"/>
  <text class="n-title" x="783" y="96" text-anchor="middle" style="fill:var(--add,#4fc389)">VIN present</text>
  <text class="n-sub" x="783" y="115" text-anchor="middle">status mutates + emits</text>

  <rect class="n-box" x="690" y="238" width="186" height="66" rx="9"/>
  <text class="n-title" x="783" y="262" text-anchor="middle" style="fill:var(--rem,#ee6d5f)">VIN missing</text>
  <text class="n-sub" x="783" y="281" text-anchor="middle">400 ValidationError</text>
  <text class="n-sub" x="783" y="295" text-anchor="middle">before mutation/emit</text>

  <!-- client edges -->
  <path class="flow hot" d="M234,64 C320,64 330,150 390,158" marker-end="url(#a)"/>
  <text class="flow-lbl hot" x="312" y="104" text-anchor="middle">vehicles[].vin ✓</text>
  <path class="flow brkline" d="M234,178 L390,182" marker-end="url(#ar)"/>
  <text class="flow-lbl rem" x="312" y="170" text-anchor="middle">no vin → 400</text>
  <path class="flow brkline" d="M234,292 C320,292 330,220 390,206" marker-end="url(#ar)"/>

  <!-- persist -->
  <path class="flow" d="M492,250 L492,298" marker-end="url(#a)"/>
  <text class="flow-lbl" x="512" y="278">persist</text>

  <!-- outcome edges -->
  <path class="flow hot" d="M592,155 C645,120 655,108 688,102" marker-end="url(#a)"/>
  <path class="flow brkline" d="M592,215 C645,250 655,262 688,268" marker-end="url(#ar)"/>
</svg>
