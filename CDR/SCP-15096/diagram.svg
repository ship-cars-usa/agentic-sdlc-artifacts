<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/></marker>
    
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>

  <!-- clients -->
  <rect class="n-box touched" x="24" y="36" width="210" height="56" rx="9" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text class="n-title" x="129" y="60" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">CTMS web · StatusUpdateDialog</text>
  <text class="n-sub" x="129" y="78" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">+ vehicles[].vin</text>

  <rect class="n-box touched" x="24" y="150" width="210" height="56" rx="9" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text class="n-title" x="129" y="174" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">epod-ios · ManualStatusUpdate</text>
  <text class="n-sub" x="129" y="192" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">DTO has no vin today</text>

  <rect class="n-box touched" x="24" y="264" width="210" height="56" rx="9" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text class="n-title" x="129" y="288" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">epod-android · UpdateOrderManually</text>
  <text class="n-sub" x="129" y="306" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">no vin · offline drop on 400</text>

  <!-- backend endpoint -->
  <rect class="n-box touched" x="392" y="120" width="200" height="130" rx="11" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text class="n-title" x="492" y="148" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">platform-backend</text>
  <text class="n-sub" x="492" y="170" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">POST manual_pickup/</text>
  <text class="n-sub" x="492" y="185" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">POST manual_deliver/</text>
  <text class="flow-lbl" x="492" y="208" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#374151" font-size="12">gate: is_enabled(flag)</text>
  <text class="flow-lbl" x="492" y="223" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#374151" font-size="12">&amp;&amp; !forbid_vehicle_update</text>
  <text class="badge chg" x="492" y="242" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="11" font-weight="600">validate VIN ≥6 before mutate</text>

  <!-- store -->
  <rect class="n-box" x="392" y="300" width="200" height="52" rx="9" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text class="store" x="492" y="322" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#7a828b" font-size="11" font-style="italic">epod_vehicle.vin</text>
  <text class="store" x="492" y="338" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#7a828b" font-size="11" font-style="italic">Vehicle.set_vin()</text>

  <!-- outcomes -->
  <rect class="n-box" x="690" y="70" width="186" height="60" rx="9" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text class="n-title" x="783" y="96" text-anchor="middle" style="fill:var(--add,#4fc389)" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">VIN present</text>
  <text class="n-sub" x="783" y="115" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">status mutates + emits</text>

  <rect class="n-box" x="690" y="238" width="186" height="66" rx="9" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text class="n-title" x="783" y="262" text-anchor="middle" style="fill:var(--rem,#ee6d5f)" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">VIN missing</text>
  <text class="n-sub" x="783" y="281" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">400 ValidationError</text>
  <text class="n-sub" x="783" y="295" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">before mutation/emit</text>

  <!-- client edges -->
  <path class="flow hot" d="M234,64 C320,64 330,150 390,158" marker-end="url(#a)" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <text class="flow-lbl hot" x="312" y="104" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="12">vehicles[].vin ✓</text>
  <path class="flow brkline" d="M234,178 L390,182" marker-end="url(#ar)" fill="none" stroke="#8a929b" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text class="flow-lbl rem" x="312" y="170" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b91c1c" font-size="12">no vin → 400</text>
  <path class="flow brkline" d="M234,292 C320,292 330,220 390,206" marker-end="url(#ar)" fill="none" stroke="#8a929b" stroke-width="1.6" stroke-dasharray="5 3"/>

  <!-- persist -->
  <path class="flow" d="M492,250 L492,298" marker-end="url(#a)" fill="none" stroke="#8a929b" stroke-width="1.6"/>
  <text class="flow-lbl" x="512" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#374151" font-size="12">persist</text>

  <!-- outcome edges -->
  <path class="flow hot" d="M592,155 C645,120 655,108 688,102" marker-end="url(#a)" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <path class="flow brkline" d="M592,215 C645,250 655,262 688,268" marker-end="url(#ar)" fill="none" stroke="#8a929b" stroke-width="1.6" stroke-dasharray="5 3"/>
</svg>
