  <path d="M383 150 V92" class="flow brkline" marker-end="url(#ar12r)" fill="none" stroke="#8a929b" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="393" y="126" class="flow-lbl rem" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b91c1c" font-size="12">resync reads lbv3 directly — breaks</text>
