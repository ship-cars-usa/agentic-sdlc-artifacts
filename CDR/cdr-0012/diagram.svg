  <rect x="298" y="20" width="170" height="70" rx="11" class="n-box touched" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="312" y="48" class="n-title" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">PG · postings</text><text x="312" y="68" class="store" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#7a828b" font-size="11" font-style="italic">main instance</text>
  <text x="298" y="12" class="badge chg" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="11" font-weight="600">rename column</text>
