<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="loadboard-backend writes and migrates the postings table; syncer's resyncer reads the renamed column directly from that database over the lbv3 reactive datasource before indexing into ES loadboard-postings, so the rename breaks the resync SQL, while the steady-state listener path uses the Pub/Sub payload.">
  <defs>
    <marker id="ar12" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45309"/></marker>
    <marker id="ar12r" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="230" fill="#ffffff"/>
  <rect x="10" y="20" width="170" height="70" rx="11" class="n-box" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="24" y="48" class="n-title" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">loadboard-backend</text><text x="24" y="68" class="n-sub" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">owns the schema</text>
