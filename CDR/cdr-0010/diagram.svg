<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="syncer owns the companies index mapping via CompanyReadDto in models-lib; the name field's ngram analyzer means an analyzer change forces a delete-and-full-resync of the companies and verified-companies indices, which cube reads.">
  <defs><marker id="ar10" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45309"/></marker></defs>
  <rect x="0" y="0" width="720" height="180" fill="#ffffff"/>
  <rect x="10" y="54" width="170" height="72" rx="11" class="n-box touched" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="24" y="82" class="n-title" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">syncer</text><text x="24" y="102" class="n-sub" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">CompanyReadDto (models-lib)</text>
  <text x="10" y="46" class="badge chg" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="11" font-weight="600">@NGramTokenizerAnalyzer on name</text>
  <path d="M180 90 H276" class="flow hot" marker-end="url(#ar10)" fill="none" stroke="#b45309" stroke-width="1.8"/><text x="228" y="82" class="flow-lbl hot" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="12">drop + resync</text>
  <rect x="278" y="54" width="170" height="72" rx="11" class="n-box touched" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="292" y="82" class="n-title" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">ES · companies</text><text x="292" y="102" class="store" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#7a828b" font-size="11" font-style="italic">+ verified-companies</text>
  <text x="278" y="46" class="badge chg" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="11" font-weight="600">reflection mapping</text>
  <path d="M448 90 H544" class="flow hot" marker-end="url(#ar10)" fill="none" stroke="#b45309" stroke-width="1.8"/><text x="496" y="82" class="flow-lbl hot" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="12">read</text>
  <rect x="546" y="54" width="164" height="72" rx="11" class="n-box touched" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="560" y="82" class="n-title" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">cube</text><text x="560" y="102" class="n-sub" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">CompaniesEsQueryBuilder</text>
</svg>
