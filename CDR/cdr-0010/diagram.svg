  <defs><marker id="ar10" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker></defs>
  <rect x="10" y="54" width="170" height="72" rx="11" class="n-box touched"/>
  <text x="24" y="82" class="n-title">syncer</text><text x="24" y="102" class="n-sub">CompanyReadDto (models-lib)</text>
  <text x="10" y="46" class="badge chg">@NGramTokenizerAnalyzer on name</text>
  <path d="M180 90 H276" class="flow hot" marker-end="url(#ar10)"/><text x="228" y="82" class="flow-lbl hot" text-anchor="middle">drop + resync</text>
  <rect x="278" y="54" width="170" height="72" rx="11" class="n-box touched"/>
  <text x="292" y="82" class="n-title">ES · companies</text><text x="292" y="102" class="store">+ verified-companies</text>
  <text x="278" y="46" class="badge chg">reflection mapping</text>
  <path d="M448 90 H544" class="flow hot" marker-end="url(#ar10)"/><text x="496" y="82" class="flow-lbl hot" text-anchor="middle">read</text>
  <rect x="546" y="54" width="164" height="72" rx="11" class="n-box touched"/>
  <text x="560" y="82" class="n-title">cube</text><text x="560" y="102" class="n-sub">CompaniesEsQueryBuilder</text>
