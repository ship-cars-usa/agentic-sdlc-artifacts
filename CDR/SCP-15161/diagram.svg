<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452">
  <defs>
    <marker id="a-grey" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <polygon points="0 0, 8 3.2, 0 6.4" fill="#8a929b"/>
    </marker>
    <marker id="a-hot" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <polygon points="0 0, 8 3.2, 0 6.4" fill="#b45309"/>
    </marker>
    <marker id="a-break" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <polygon points="0 0, 8 3.2, 0 6.4" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="452" fill="#ffffff"/>

  <text x="20" y="28" fill="#16191d" font-size="14" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">SCP-15161 — where the attachment guard's ownership boundary sits, and where it belongs</text>
  <text x="20" y="46" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">One predicate changes. No schema, no DTO, no endpoint, no event field.</text>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#16191d">
    <rect x="20" y="66" width="122" height="34" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="81" y="82">PENDING_</text><text x="81" y="94">POSTING</text>
    <rect x="150" y="66" width="106" height="34" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="203" y="88">POSTED</text>
    <rect x="264" y="66" width="126" height="34" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="327" y="82">CARRIER_</text><text x="327" y="94">PENDING</text>
    <rect x="398" y="66" width="122" height="34" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="459" y="88">DISPATCHED</text>
    <rect x="528" y="66" width="114" height="34" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="585" y="88">PICKED_UP</text>
    <rect x="650" y="66" width="114" height="34" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="707" y="88">DELIVERED</text>
    <rect x="772" y="66" width="106" height="34" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="825" y="88">ARCHIVED</text>
  </g>
  <line x1="878" y1="83" x2="962" y2="83" stroke="#8a929b" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <text x="920" y="76" fill="#7a828b" font-size="10" font-style="italic" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">time</text>

  <text x="20" y="140" fill="#b91c1c" font-size="12" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">🔴 Today — inbound attachment guard compares only lb_posting_version != CTMS</text>
  <rect x="20" y="150" width="858" height="36" rx="6" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="449" y="173" fill="#b91c1c" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">SKIP — for every status, for the whole life of the load. Silently: log.debug only, root level = INFO.</text>

  <text x="20" y="224" fill="#1a7f37" font-size="12" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">🟡 Proposed — Utilities.isCtmsOperated(status) = CARRIER_PENDING ∪ isLoadDispatched(status)</text>
  <rect x="20" y="234" width="236" height="36" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="138" y="257" fill="#5c646d" font-size="11.5" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">skip — LBV3 owns it</text>
  <rect x="264" y="234" width="500" height="36" rx="6" fill="#e3f5e8" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="514" y="257" fill="#1a7f37" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">PROCESS — CTMS operates the load</text>
  <rect x="772" y="234" width="106" height="36" rx="6" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.8"/>
  <text x="825" y="257" fill="#b45309" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">open — Q2</text>

  <text x="20" y="308" fill="#b45309" font-size="12" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">🔵 Outbound today — getLoadboardSource / isOrder, walking status_history back to the last meaningful status</text>
  <rect x="20" y="318" width="236" height="36" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="138" y="341" fill="#5c646d" font-size="11.5" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">→ LBV3</text>
  <rect x="264" y="318" width="500" height="36" rx="6" fill="#f5f6f8" stroke="#8a929b" stroke-width="1.6"/>
  <text x="514" y="341" fill="#374151" font-size="11.5" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">→ CTMS   (PICKED_UP / DELIVERED reached by looking back to DISPATCHED)</text>
  <rect x="772" y="318" width="106" height="36" rx="6" fill="#f5f6f8" stroke="#8a929b" stroke-width="1.6"/>
  <text x="825" y="341" fill="#374151" font-size="11.5" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">→ CTMS</text>

  <line x1="260" y1="58" x2="260" y2="368" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="260" y="384" fill="#1a7f37" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">the boundary the fix installs</text>

  <path d="M 449 296 C 449 288, 700 286, 825 276" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>

  <rect x="20" y="398" width="960" height="40" rx="6" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="34" y="416" fill="#1a7f37" font-size="11" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">The existing intentional-skip integration test stays green.</text>
  <text x="34" y="431" fill="#5c646d" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">Its fixture is STATUS='POSTED' (db/loadLoadLeg.sql:59-63) — left of the boundary — so consumeAttachment_SkipsAttachmentCreation_WhenPostingIsOwnedByLbV3 (:1213) still passes. The change is additive to a tested decision, not a reversal of one.</text>
</svg>
