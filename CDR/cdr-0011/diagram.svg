<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="platform-frontend calls the gateway which routes /api/inventory/v2/units to a proposed new V2UnitsController in inventory-backend; the existing V1UnitsController remains available in parallel.">
  <defs><marker id="ar11" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker></defs>
  <rect x="10" y="54" width="170" height="72" rx="11" class="n-box"/>
  <text x="24" y="82" class="n-title">platform-frontend</text><text x="24" y="102" class="n-sub">consumer</text>
  <path d="M180 90 H276" class="flow hot" marker-end="url(#ar11)"/><text x="229" y="82" class="flow-lbl hot" text-anchor="middle">request</text>
  <rect x="278" y="54" width="170" height="72" rx="11" class="n-box"/>
  <text x="292" y="82" class="n-title">api-gateway</text><text x="292" y="102" class="n-sub">prepends /api/{svc}</text>
  <path d="M448 90 H544" class="flow hot" marker-end="url(#ar11)"/><text x="497" y="82" class="flow-lbl hot" text-anchor="middle">POST</text>
  <rect x="546" y="42" width="164" height="46" rx="10" class="n-box touched"/>
  <text x="560" y="70" class="n-title">V2UnitsController</text>
  <rect x="546" y="96" width="164" height="42" rx="10" class="n-box"/>
  <text x="560" y="122" class="n-sub">V1UnitsController (kept)</text>
  <text x="546" y="34" class="badge add">+ endpoint (proposed)</text>
</svg>
