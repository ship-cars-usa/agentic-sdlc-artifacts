<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="platform-frontend calls the gateway which routes /api/inventory/v2/units to a proposed new V2UnitsController in inventory-backend; the existing V1UnitsController remains available in parallel.">
  <defs><marker id="ar11" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45309"/></marker></defs>
  <rect x="0" y="0" width="720" height="180" fill="#ffffff"/>
  <rect x="10" y="54" width="170" height="72" rx="11" class="n-box" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="24" y="82" class="n-title" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">platform-frontend</text><text x="24" y="102" class="n-sub" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">consumer</text>
  <path d="M180 90 H276" class="flow hot" marker-end="url(#ar11)" fill="none" stroke="#b45309" stroke-width="1.8"/><text x="229" y="82" class="flow-lbl hot" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="12">request</text>
  <rect x="278" y="54" width="170" height="72" rx="11" class="n-box" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="292" y="82" class="n-title" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">api-gateway</text><text x="292" y="102" class="n-sub" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">prepends /api/{svc}</text>
  <path d="M448 90 H544" class="flow hot" marker-end="url(#ar11)" fill="none" stroke="#b45309" stroke-width="1.8"/><text x="497" y="82" class="flow-lbl hot" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#b45309" font-size="12">POST</text>
  <rect x="546" y="42" width="164" height="46" rx="10" class="n-box touched" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="560" y="70" class="n-title" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#16191d" font-size="14" font-weight="600">V2UnitsController</text>
  <rect x="546" y="96" width="164" height="42" rx="10" class="n-box" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="560" y="122" class="n-sub" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#5c646d" font-size="12">V1UnitsController (kept)</text>
  <text x="546" y="34" class="badge add" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#2f7d55" font-size="11" font-weight="600">+ endpoint (proposed)</text>
</svg>
