<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 450" width="1020" height="450" role="img" aria-label="One log-based metric replaces three, feeding two alert policies with different severities">
  <defs>
    <marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#b45309"/>
    </marker>
    <marker id="a-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#8a929b"/>
    </marker>
    <marker id="a-rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1020" height="450" fill="#ffffff"/>

  <text x="20" y="28" fill="#16191d" font-size="15" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">SCP-15149 — two-tier import alarm off one purpose-named metric</text>
  <text x="20" y="47" fill="#7a828b" font-size="11" font-style="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">orange = changed · grey = reused as-is · red dashed = removed</text>

  <!-- signal source -->
  <rect x="20" y="180" width="210" height="90" rx="8" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="125" y="207" text-anchor="middle" fill="#16191d" font-size="14" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">platform-backend</text>
  <text x="125" y="227" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">epod/models.py:3334</text>
  <text x="125" y="245" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">"ML parser exception"</text>
  <text x="125" y="262" text-anchor="middle" fill="#7a828b" font-size="11" font-style="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">web container only</text>

  <!-- metric -->
  <rect x="290" y="180" width="230" height="90" rx="8" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="405" y="207" text-anchor="middle" fill="#16191d" font-size="14" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">metric-ml-parser-unavailable</text>
  <text x="405" y="227" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">google_logging_metric · DELTA/INT64</text>
  <text x="405" y="245" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">container_name = "platform-backend"</text>
  <text x="405" y="262" text-anchor="middle" fill="#7a828b" font-size="11" font-style="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">one metric, no for_each</text>

  <!-- removed -->
  <rect x="290" y="318" width="230" height="82" rx="8" fill="#fdf2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="405" y="343" text-anchor="middle" fill="#b91c1c" font-size="13" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">removed — 3× for_each</text>
  <text x="405" y="362" text-anchor="middle" fill="#5c646d" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">platform-backend-errors</text>
  <text x="405" y="378" text-anchor="middle" fill="#5c646d" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">celery-errors · celery-dynamic-errors</text>
  <text x="405" y="394" text-anchor="middle" fill="#7a828b" font-size="11" font-style="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">latter two never emitted a point</text>
  <path d="M405 314 L405 276" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#a-rm)"/>
  <text x="530" y="300" fill="#b91c1c" font-size="11" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">replaced by</text>

  <!-- tier 1 -->
  <rect x="590" y="52" width="230" height="98" rx="8" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="705" y="78" text-anchor="middle" fill="#16191d" font-size="14" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">Tier 1 — outage</text>
  <text x="705" y="98" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">severity CRITICAL</text>
  <text x="705" y="116" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">ALIGN_DELTA · REDUCE_SUM</text>
  <text x="705" y="134" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">threshold 3 / 600 s</text>

  <!-- tier 2 -->
  <rect x="590" y="300" width="230" height="98" rx="8" fill="#fbe7d6" stroke="#c2703d" stroke-width="1.5"/>
  <text x="705" y="326" text-anchor="middle" fill="#16191d" font-size="14" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">Tier 2 — single failure</text>
  <text x="705" y="346" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">severity WARNING</text>
  <text x="705" y="364" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">comparison &gt; 0</text>
  <text x="705" y="382" text-anchor="middle" fill="#5c646d" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">rate limit 300 s</text>

  <!-- sinks -->
  <rect x="860" y="72" width="145" height="58" rx="8" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="932" y="96" text-anchor="middle" fill="#16191d" font-size="13" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">page on-call</text>
  <text x="932" y="115" text-anchor="middle" fill="#5c646d" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">+ runbook</text>

  <rect x="860" y="320" width="145" height="58" rx="8" fill="#f5f6f8" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="932" y="344" text-anchor="middle" fill="#16191d" font-size="13" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">#ml-notify</text>
  <text x="932" y="363" text-anchor="middle" fill="#5c646d" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">awareness</text>

  <!-- edges -->
  <path d="M232 225 L284 225" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#a-hot)"/>
  <text x="258" y="216" text-anchor="middle" fill="#b45309" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">log</text>

  <path d="M522 208 L584 128" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#a-hot)"/>
  <text x="556" y="152" text-anchor="middle" fill="#b45309" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">≥ 3 / 10 min</text>

  <path d="M522 243 L584 322" stroke="#8a929b" stroke-width="1.6" fill="none" marker-end="url(#a-plain)"/>
  <text x="556" y="300" text-anchor="middle" fill="#374151" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">any 1</text>

  <path d="M822 101 L854 101" stroke="#8a929b" stroke-width="1.6" fill="none" marker-end="url(#a-plain)"/>
  <path d="M822 349 L854 349" stroke="#8a929b" stroke-width="1.6" fill="none" marker-end="url(#a-plain)"/>
</svg>
